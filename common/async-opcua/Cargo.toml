[package]
name = "benchmark-async-opcua"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-opcua = { path = "../../deps/async-opcua-src/async-opcua", default-features = false, features = ["server"] }
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "macros"] }
